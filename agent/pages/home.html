<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frappe Cloud</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        color-scheme: light;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, "Helvetica Neue", sans-serif;
        background-color: #ffffff;
        color: #171717;
        min-height: 100vh;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 48px;
      }

      .content {
        max-width: 26rem;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .text {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
      }

      p {
        font-size: 14px;
        line-height: 1.5;
        color: #525252;
      }

      .footer {
        font-size: 14px;
        line-height: 1.5;
        text-align: center;
        color: #7c7c7c;
      }

      a {
        color: #0070cc;
      }

      /* plain-html visited purple. must not reach .button, whose label is white */
      a:not(.button):visited {
        color: #551a8b;
      }

      .button {
        display: inline-flex;
        align-items: center;
        padding: 8px 12px;
        border-radius: 8px;
        background-color: #171717;
        color: #ffffff;
        font-size: 14px;
        text-decoration: none;
      }

      .button:hover {
        background-color: #2f2f2f;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <svg
        width="40"
        height="40"
        viewBox="0 0 40 40"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <circle cx="20" cy="20" r="16.5" stroke="#737373" stroke-width="2.5" />
        <path
          d="M16.4 16.1a3.6 3.6 0 1 1 5 3.4c-.9.4-1.4 1.2-1.4 2.1v.7"
          stroke="#737373"
          stroke-width="2.5"
          stroke-linecap="round"
        />
        <circle cx="20" cy="26.5" r="1.75" fill="#737373" />
      </svg>
      <div class="text">
        <h1>Are you lost?</h1>
        <p>This address does not point to a site on Frappe Cloud.</p>
      </div>
      <a class="button" href="https://frappecloud.com">Go to Frappe Cloud</a>
    </div>
  </body>
</html>
