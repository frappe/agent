name: Python 3.14 DuckDB Compatibility

on:
  push:
    branches:
      - fix-python314-duckdb
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install compatibility candidates
        run: |
          python -m pip install --upgrade pip
          pip install "duckdb==1.5.5" "filelock==3.13.1" "PyMySQL==0.9.3" "requests==2.26.0"
          pip install --no-deps "mariadb-binlog-indexer==0.0.20"

      - name: Verify package metadata and imports
        run: |
          python - <<'PY'
          from importlib.metadata import distribution, version
          import duckdb
          dist = distribution("mariadb-binlog-indexer")
          print("mariadb-binlog-indexer", version("mariadb-binlog-indexer"))
          print("Requires-Dist:")
          for req in dist.requires or []:
              print(" -", req)
          print("duckdb", duckdb.__version__)
          top_levels = sorted({
              str(path).split("/")[0]
              for path in (dist.files or [])
              if "/" in str(path) and str(path).endswith(".py")
          })
          print("top_levels", top_levels)
          imported = []
          for name in top_levels:
              if name.endswith(".dist-info") or name.startswith("_"):
                  continue
              try:
                  __import__(name)
                  imported.append(name)
              except Exception as exc:
                  print("import failed", name, type(exc).__name__, str(exc))
                  raise
          print("imported", imported)
          PY

      - name: Inspect DuckDB API usage
        run: |
          python - <<'PY'
          from importlib.metadata import distribution
          from pathlib import Path
          dist = distribution("mariadb-binlog-indexer")
          root = Path(dist.locate_file(""))
          seen = 0
          for item in dist.files or []:
              p = Path(dist.locate_file(item))
              if p.suffix != ".py" or not p.exists():
                  continue
              text = p.read_text(encoding="utf-8", errors="ignore")
              if "duckdb" in text:
                  print("FILE", item)
                  for line in text.splitlines():
                      if "duckdb" in line:
                          print(line[:500])
                          seen += 1
          print("duckdb references", seen)
          PY
