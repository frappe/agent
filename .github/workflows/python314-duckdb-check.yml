name: Python 3.14 DuckDB Compatibility

on:
  push:
    branches:
      - fix-python314-duckdb
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install compatibility candidates
        run: |
          python -m pip install --upgrade pip
          pip install "duckdb==1.5.5"
          pip install --no-deps "mariadb-binlog-indexer==0.0.20"

      - name: Verify package metadata and imports
        run: |
          python - <<'PY'
          from importlib.metadata import distribution, version
          import duckdb
          dist = distribution("mariadb-binlog-indexer")
          print("mariadb-binlog-indexer", version("mariadb-binlog-indexer"))
          print("Requires-Dist:")
          for req in dist.requires or []:
              print(" -", req)
          print("duckdb", duckdb.__version__)
          candidates = [
              "mariadb_binlog_indexer",
              "binlog_indexer",
          ]
          imported = []
          for name in candidates:
              try:
                  __import__(name)
                  imported.append(name)
              except ModuleNotFoundError:
                  pass
          print("imported", imported)
          PY
