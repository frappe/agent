name: AI Runtime Autofix

on:
  push:
    branches:
      - foundry-agent-runtime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundry-agent-runtime

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Apply safe lint fixes and formatting
        run: |
          ruff check --fix \
            agent/ai_control/a2a_copilot.py \
            agent/ai_control/a2a_runtime.py \
            agent/ai_control/a2a_server.py \
            agent/ai_control/foundry.py \
            agent/ai_control/knowledge.py \
            agent/ai_control/mcp_server.py \
            agent/ai_control/protocols.py \
            agent/ai_control/routes.py \
            agent/ai_control/store.py \
            agent/ai_control/training.py \
            agent/web.py || true
          ruff format \
            agent/ai_control/a2a_copilot.py \
            agent/ai_control/a2a_runtime.py \
            agent/ai_control/a2a_server.py \
            agent/ai_control/foundry.py \
            agent/ai_control/knowledge.py \
            agent/ai_control/mcp_server.py \
            agent/ai_control/protocols.py \
            agent/ai_control/routes.py \
            agent/ai_control/store.py \
            agent/ai_control/training.py \
            agent/web.py

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "Alazab Runtime CI"
          git config user.email "actions@users.noreply.github.com"
          git add agent/ai_control agent/web.py
          git commit -m "style(ai): apply repository lint and format fixes"
          git push origin HEAD:foundry-agent-runtime
