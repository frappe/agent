name: AI Runtime Format

on:
  push:
    branches:
      - foundry-agent-runtime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundry-agent-runtime

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Format AI runtime
        run: |
          pip install ruff
          ruff format \
            agent/ai_control \
            agent/web.py \
            agent/tests/test_ai_foundry_runtime_contract_static.py \
            agent/tests/test_ai_foundry_runtime_functional.py \
            agent/tests/test_ai_protocol_auth.py \
            agent/patches/expand_ai_control_center_foundry_runtime_v4.py

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "Alazab Runtime CI"
          git config user.email "actions@users.noreply.github.com"
          git add agent/ai_control agent/web.py agent/tests agent/patches
          git commit -m "style(ai): format complete Foundry control plane"
          git push origin HEAD:foundry-agent-runtime
